; Admin saves the whole balance (unit/building stats + uploaded images and music
; as data URLs) in one JSON POST. Raise PHP's request/body limits so those saves
; aren't rejected as "too big". Hostinger (LiteSpeed/PHP) reads .user.ini.
post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M
max_input_time = 120
max_execution_time = 120
