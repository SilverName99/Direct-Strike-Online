<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puppet Preview — Direct Strike Online</title>
  <style>
    body { background: #0d1117; color: #dbe4f0; font-family: system-ui, sans-serif; padding: 24px; }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p { color: #7c8ba1; font-size: 13px; margin-bottom: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 14px; }
    .cell { background: #161c26; border: 1px solid #2a3446; border-radius: 10px; padding: 10px; text-align: center; }
    .cell canvas { background: #0e141d; border-radius: 6px; }
    .cell .label { font-size: 12px; margin-top: 6px; color: #dbe4f0; }
    .anim-row { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Puppet Preview</h1>
  <p>Toate animațiile × frame-urile, ambele echipe, + celulă animată live. Editează <code>src/render/puppets.js</code> și dă refresh.</p>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { PUPPETS, PALETTES, drawPuppet } from '../src/render/puppets.js';

    const grid = document.getElementById('grid');
    const SCALE = 4;
    const SIZE = 140;

    function makeCell(label) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      cell.appendChild(canvas);
      const div = document.createElement('div');
      div.className = 'label';
      div.textContent = label;
      cell.appendChild(div);
      grid.appendChild(cell);
      return canvas.getContext('2d');
    }

    for (const type of Object.keys(PUPPETS)) {
      // static: every anim × frame × team
      for (const anim of Object.keys(PUPPETS[type].anims)) {
        for (let frame = 0; frame < 2; frame++) {
          for (const team of [0, 1]) {
            const ctx = makeCell(`${type} · ${anim} ${frame + 1} · ${team === 0 ? 'blue' : 'red'}`);
            ctx.translate(SIZE / 2, SIZE / 2 + 6);
            if (team === 1) ctx.scale(-1, 1);
            drawPuppet(ctx, type, anim, frame, PALETTES[team], SCALE);
          }
        }
      }
      // live animated cell per anim (blue)
      for (const anim of Object.keys(PUPPETS[type].anims)) {
        const ctx = makeCell(`${type} · ${anim} · LIVE`);
        const speed = anim === 'walk' ? 5 : anim === 'attack' ? 3 : 2;
        setInterval(() => {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, SIZE, SIZE);
          ctx.translate(SIZE / 2, SIZE / 2 + 6);
          const frame = Math.floor(performance.now() / 1000 * speed) % 2;
          drawPuppet(ctx, type, anim, frame, PALETTES[0], SCALE);
          ctx.restore();
        }, 60);
      }
    }
  </script>
</body>
</html>
