<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fangs &amp; Honor</title>
  <link rel="icon" id="favicon"><!-- href set from the uploaded asset (manifest) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Boot loader: shown on first paint (before the modules run) and kept up
       until the menu is fully ready (balance + logo/background preloaded), so
       nothing pops in one piece at a time. Golden themed. -->
  <div id="boot">
    <div class="boot-ring"></div>
    <div class="boot-label">Loading</div>
  </div>
  <div id="app">
    <header id="topbar">
      <div class="hud-side hud-left">
        <div class="hud-chip" id="chip-gold" title="Aur · venit pe secundă">
          <span class="chip-ico money-icon">◆</span>
          <div class="chip-body">
            <span id="money" class="chip-main">0</span>
            <span id="income" class="chip-sub">+10/s</span>
          </div>
        </div>
        <div class="hud-chip" id="chip-food" title="Food folosit / plafon (crește-l cu Ferme)">
          <span class="chip-ico">🍖</span>
          <div class="chip-body">
            <span id="food" class="chip-main">0/20</span>
            <span class="chip-sub">food</span>
          </div>
        </div>
        <div class="hud-chip" id="chip-skel" title="Schelete vii / plafon (crește plafonul de la bază)" style="display:none">
          <span class="chip-ico">💀</span>
          <div class="chip-body">
            <span id="skel" class="chip-main">0/3</span>
            <span class="chip-sub">schelete</span>
          </div>
        </div>
        <span id="tier" class="tier-badge">TIER I</span>
        <button id="range-btn" class="hud-btn" title="Arată razele de atac + cutiile fizice (debug)">🎯</button>
      </div>

      <div class="hud-center">
        <div class="hud-chip wave-chip" id="chip-wave">
          <span class="wave-main">WAVE <b id="wave-num">0</b></span>
          <span class="wave-sub">următorul val în <b id="wave-timer">20</b>s</span>
        </div>
      </div>

      <div class="hud-side hud-right">
        <div id="snd-ctl" class="hud-snd" title="Muzică — trage pentru volum, click pe iconiță pentru mute">
          <button id="mute-btn" title="Muzică on/off">🔊</button>
          <input type="range" id="game-vol" class="hud-vol" min="0" max="100" value="100" aria-label="Volum muzică">
        </div>
        <div id="sfx-ctl" class="hud-snd" title="Sunet de luptă — trage pentru volum, click pe iconiță pentru mute">
          <button id="sfx-btn" title="Sunet de luptă on/off">💥</button>
          <input type="range" id="sfx-vol" class="hud-vol" min="0" max="100" value="100" aria-label="Volum sunet de luptă">
        </div>
        <button id="uiscale-btn" class="hud-btn" title="Mărește bara de jos (1× / 1.2× / 1.4× / 1.6×)">1×</button>
        <button id="fs-btn" class="hud-btn" title="Fullscreen (F)">⛶</button>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="game"></canvas>
      <span id="version" class="dim"></span>
      <!-- Hero badge: pinned to the left edge once the hero is bought; shows
           its thumb, level and % progress to the next level at all times -->
      <div id="hero-badges"></div>
    </div>

    <!-- WC3-style bottom bar: map | portrait | details | 4x4 command grid | tabs -->
    <footer id="bottombar">
      <svg id="bb-bg"><path d=""></path></svg>
      <div id="bb-map"><canvas id="minimap"></canvas></div>
      <div id="bb-portrait"><canvas id="portrait" width="112" height="112"></canvas><video id="bb-portrait-vid" muted loop playsinline></video></div>
      <div id="bb-details"><div class="bb-empty">Selectează o unitate sau o clădire.</div></div>
      <div id="bb-grid-wrap">
        <div id="bb-popup"></div>
        <div id="bb-grid"></div>
      </div>
      <div id="bb-tabs">
        <button id="tab-units" class="bb-tab active" title="Unități (cumpără)"><canvas width="72" height="72"></canvas><span>UNITS</span></button>
        <button id="tab-buildings" class="bb-tab" title="Clădiri (construiește)"><canvas width="72" height="72"></canvas><span>CLĂDIRI</span></button>
      </div>
      <!-- Vinde: its own column, to the RIGHT of the UNITS/CLĂDIRI tabs -->
      <div id="bb-sell-col">
        <button id="bb-move" class="hidden" title="Mută clădirea în alt loc (se reconstruiește 30s)"><span id="bb-move-ico">✥</span><span>Mută</span></button>
        <button id="bb-sell" class="hidden" title="Vinde selecția"><span id="bb-sell-ico">💰</span><span id="bb-sell-cost"></span></button>
      </div>
      <div id="bb-over"></div>
    </footer>

    <!-- Entry menu + game-over screen — built by src/ui/menu.js -->
    <div id="overlay" class="visible"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
